name: Build Feather Browser (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download NuGet CLI
        shell: pwsh
        run: |
          Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile "$env:RUNNER_TEMP\nuget.exe"
          & "$env:RUNNER_TEMP\nuget.exe" help | Out-Null


      - name: Download WebView2 SDK package
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\nuget.exe" install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "NuGet package download failed" }
          if (!(Test-Path "packages\Microsoft.Web.WebView2.1.0.2903.40\build\native\include\WebView2.h")) { throw "WebView2.h was not found in the downloaded SDK" }

      - name: Build Release x64
        shell: pwsh
        run: |
          msbuild FeatherBrowser.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }
          if (!(Test-Path "bin\Release\FeatherBrowser.exe")) { throw "Expected executable was not produced" }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FeatherBrowser-Windows-x64
          path: bin/Release/FeatherBrowser.exe
          if-no-files-found: error
          retention-days: 14
